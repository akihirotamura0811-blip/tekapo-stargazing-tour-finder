<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tekapo Stargazing Tour Finder</title>
  <style>
    :root{
      --bg:#06101d; --panel:#0d1b2a; --panel2:#12263a; --text:#f7fbff;
      --muted:#9fb4c8; --accent:#83cfff; --border:#27475f; --good:#bfe8ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;padding:18px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
      background:radial-gradient(circle at top,#17395e 0,#07111f 45%,#030812 100%);
      color:var(--text);
    }
    .app{width:min(760px,100%);margin:0 auto}
    .hero{padding:10px 2px 18px}
    .badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:7px 10px;color:var(--accent);font-size:13px}
    h1{font-size:30px;margin:10px 0 6px}
    .lead{margin:0;color:var(--muted);line-height:1.65}
    .card{background:rgba(13,27,42,.94);border:1px solid var(--border);border-radius:22px;padding:22px;margin-bottom:14px}
    .topline{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
    .progress{height:9px;background:#091725;border:1px solid #1d3448;border-radius:999px;overflow:hidden;margin:12px 0 24px}
    .bar{height:100%;background:var(--accent);transition:.2s ease}
    .question{font-size:23px;line-height:1.5;margin:0 0 10px}
    .hint{color:var(--muted);line-height:1.65;margin:0 0 22px}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    button{
      appearance:none;border:1px solid var(--border);border-radius:16px;
      padding:16px 18px;font-size:18px;font-weight:700;cursor:pointer;
      background:var(--panel2);color:var(--text)
    }
    button:hover{border-color:var(--accent)}
    .yes{background:var(--accent);color:#06111d;border-color:var(--accent)}
    .result{display:none}
    .winner{border:1px solid var(--accent);border-radius:18px;padding:18px;background:rgba(20,55,80,.45)}
    .winner h2{margin:5px 0 6px;font-size:27px}
    .match{font-size:34px;font-weight:800;color:var(--good);margin:8px 0}
    .reason{margin:0;color:var(--muted);line-height:1.75}
    .reason-list{margin:15px 0 0;padding-left:20px;line-height:1.8}
    .alternatives{display:grid;gap:10px;margin-top:14px}
    .alt{border:1px solid var(--border);border-radius:16px;padding:14px;background:#0a1724}
    .alt strong{display:block;font-size:17px;margin-bottom:4px}
    .alt span{color:var(--accent);font-weight:700}
    .restart{width:100%;margin-top:18px}
    .note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:14px}
    @media(max-width:520px){
      body{padding:12px}.card{padding:18px}h1{font-size:25px}.question{font-size:21px}
    }
  </style>
</head>
<body>
<main class="app">
  <section class="hero">
    <span class="badge">YES / NOで約1分</span>
    <h1>Tekapo Stargazing Tour Finder</h1>
    <p class="lead">テカポの主要な星空ツアーから、あなたの希望に合う候補を診断します。</p>
  </section>

  <section class="card">
    <div class="topline">
      <span id="stepLabel">Question 1</span>
      <span id="countLabel">1 / 7</span>
    </div>
    <div class="progress"><div class="bar" id="bar" style="width:14.3%"></div></div>

    <div id="questionArea">
      <h2 class="question" id="questionText"></h2>
      <p class="hint" id="hintText"></p>
      <div class="buttons">
        <button class="yes" id="yesBtn">YES</button>
        <button id="noBtn">NO</button>
      </div>
    </div>

    <div class="result" id="resultArea">
      <div class="winner">
        <div class="badge">BEST MATCH</div>
        <h2 id="winnerName"></h2>
        <div class="match" id="winnerMatch"></div>
        <p class="reason" id="winnerSummary"></p>
        <ul class="reason-list" id="winnerReasons"></ul>
      </div>
      <div class="alternatives" id="alternatives"></div>
      <p class="note">※サンプル診断です。料金・開催条件・言語・年齢制限などは公開前に最新の公式情報へ合わせて調整してください。</p>
      <button class="restart" id="restartBtn">もう一度診断する</button>
    </div>
  </section>
</main>

<script>
const questions = [
  {key:"japanese", q:"日本語で参加できることを重視する？", hint:"YESなら、日本語ツアーのある候補を優先します。"},
  {key:"mtjohn", q:"Mt John Observatoryに行くことを重視する？", hint:"Mt Johnそのものが目的のひとつならYES。"},
  {key:"photo", q:"星空と一緒に記念写真を撮ってもらいたい？", hint:"星を見るだけでなく、旅の思い出として写真を残したい場合はYES。"},
  {key:"small", q:"大人数より、少人数でアットホームな雰囲気が好き？", hint:"ガイドとの距離の近さを重視する場合はYES。"},
  {key:"budget", q:"できるだけ料金を抑えたい？", hint:"プレミアム感よりコストパフォーマンス重視ならYES。"},
  {key:"science", q:"星を見るだけでなく、天文学の解説もしっかり聞きたい？", hint:"星座紹介以上に宇宙や天体について知りたい場合はYES。"},
  {key:"short", q:"できるだけ短時間で参加したい？", hint:"夜の予定や翌朝の予定を優先したい場合はYES。"}
];

const tours = [
  {
    name:"Dark Sky Project — Summit Experience",
    summary:"Mt John Observatoryでの特別感と、本格的な天文学体験を重視する人向け。",
    w:{japanese:3,mtjohn:7,photo:0,small:0,budget:-3,science:5,short:-3},
    reasons:{japanese:"日本語ツアー対応",mtjohn:"Mt John Observatoryで体験できる",science:"本格的な天文学解説を重視"}
  },
  {
    name:"Dark Sky Project — Crater Experience",
    summary:"本格的な天文学と望遠鏡観察を、Summitより気軽に楽しみたい人向け。",
    w:{japanese:3,mtjohn:-3,photo:0,small:0,budget:1,science:5,short:3},
    reasons:{japanese:"日本語ツアー対応",science:"天文学をしっかり楽しめる",short:"比較的コンパクトな体験"}
  },
  {
    name:"Chameleon Stargazing — Signature Tour",
    summary:"写真・親しみやすさ・アットホームな雰囲気を重視する人向け。",
    w:{japanese:-2,mtjohn:-2,photo:5,small:3,budget:3,science:2,short:1},
    reasons:{photo:"星空写真を重視",small:"アットホームな雰囲気",budget:"価格を抑えたい人と相性が良い"}
  },
  {
    name:"GO TEKAPO / Silver River — Alpine Stargazing",
    summary:"少人数感と天文学のバランスを求め、日本語開催も選択肢に入れたい人向け。",
    w:{japanese:3,mtjohn:-2,photo:3,small:4,budget:2,science:4,short:3},
    reasons:{japanese:"日本語ツアーの選択肢あり",small:"少人数を重視",science:"天文学とのバランスが良い"}
  },
  {
    name:"Astro Tekapo — Astro Experience",
    summary:"少人数・写真・気軽さのバランスを求める人向け。",
    w:{japanese:-2,mtjohn:-2,photo:5,small:5,budget:4,science:3,short:1},
    reasons:{photo:"星空写真を重視",small:"少人数を重視",budget:"コストパフォーマンス重視"}
  },
  {
    name:"Blue Star Tekapo — 星空観測フォトツアー",
    summary:"日本語と星空写真、少人数の体験を特に重視する人向け。",
    w:{japanese:6,mtjohn:-2,photo:6,small:5,budget:1,science:2,short:1},
    reasons:{japanese:"日本語で参加したい人に強くマッチ",photo:"星空写真を重視",small:"少人数の落ち着いた体験"}
  }
];

let index = 0;
let answers = {};

const qText = document.getElementById("questionText");
const hint = document.getElementById("hintText");
const stepLabel = document.getElementById("stepLabel");
const countLabel = document.getElementById("countLabel");
const bar = document.getElementById("bar");
const questionArea = document.getElementById("questionArea");
const resultArea = document.getElementById("resultArea");

function render(){
  const q = questions[index];
  qText.textContent = q.q;
  hint.textContent = q.hint;
  stepLabel.textContent = `Question ${index+1}`;
  countLabel.textContent = `${index+1} / ${questions.length}`;
  bar.style.width = `${((index+1)/questions.length)*100}%`;
}

function choose(val){
  answers[questions[index].key] = val;
  index++;
  if(index >= questions.length) showResults();
  else render();
}

function scoreTour(t){
  let s = 0;
  for(const q of questions){
    const w = t.w[q.key] || 0;
    s += answers[q.key] ? w : (w < 0 ? Math.abs(w)*0.6 : 0);
  }
  return s;
}

function showResults(){
  const ranked = tours.map(t=>({...t,score:scoreTour(t)})).sort((a,b)=>b.score-a.score);
  const max = ranked[0].score;
  const min = ranked[ranked.length-1].score;

  ranked.forEach((t,i)=>{
    let pct = max===min ? 80-i*4 : Math.round(68 + ((t.score-min)/(max-min))*30);
    if(i===0) pct = Math.max(92,pct);
    t.pct = Math.max(55,Math.min(98,pct));
  });

  questionArea.style.display="none";
  resultArea.style.display="block";
  stepLabel.textContent="Complete";
  countLabel.textContent="";
  bar.style.width="100%";

  const win = ranked[0];
  document.getElementById("winnerName").textContent = win.name;
  document.getElementById("winnerMatch").textContent = `${win.pct}% MATCH`;
  document.getElementById("winnerSummary").textContent = win.summary;

  const ul = document.getElementById("winnerReasons");
  ul.innerHTML="";
  const hitReasons = [];
  for(const q of questions){
    if(answers[q.key] && (win.w[q.key]||0) > 1 && win.reasons[q.key]){
      hitReasons.push(win.reasons[q.key]);
    }
  }
  Object.values(win.reasons).forEach(r=>{
    if(!hitReasons.includes(r) && hitReasons.length<3) hitReasons.push(r);
  });
  hitReasons.slice(0,3).forEach(r=>{
    const li=document.createElement("li"); li.textContent=r; ul.appendChild(li);
  });

  const alts = document.getElementById("alternatives");
  alts.innerHTML="<h3>Other Matches</h3>";
  ranked.slice(1,3).forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="alt";
    d.innerHTML=`<strong>${i===0?"🥈":"🥉"} ${t.name}</strong><span>${t.pct}% MATCH</span>`;
    alts.appendChild(d);
  });
}

document.getElementById("yesBtn").addEventListener("click",()=>choose(true));
document.getElementById("noBtn").addEventListener("click",()=>choose(false));
document.getElementById("restartBtn").addEventListener("click",()=>{
  index=0; answers={};
  resultArea.style.display="none";
  questionArea.style.display="block";
  render();
});

render();
</script>
</body>
</html>
